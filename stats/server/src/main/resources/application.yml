server:
  port: 9090

spring:
  application:
    name: stats-server
  datasource:
    url: jdbc:postgresql://localhost:5432/ewm_stats
    username: stats_user
    password: stats_password
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

logging:
  level:
    ru.practicum: DEBUG